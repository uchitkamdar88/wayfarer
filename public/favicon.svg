<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Compass Ring -->
  <circle cx="32" cy="32" r="28" stroke="#0B1320" stroke-width="2.5" stroke-opacity="0.9"/>
  <circle cx="32" cy="32" r="24" stroke="#C59A4E" stroke-width="1" stroke-dasharray="2 3"/>
  
  <!-- Compass Cardinal Ticks -->
  <line x1="32" y1="5" x2="32" y2="10" stroke="#0B1320" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="59" stroke="#0B1320" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="10" y2="32" stroke="#0B1320" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="59" y2="32" stroke="#0B1320" stroke-width="2" stroke-linecap="round"/>

  <!-- Compass Star / Needle -->
  <!-- North pointer (Gold/Champagne) -->
  <polygon points="32,10 36,32 32,28" fill="#C59A4E"/>
  <polygon points="32,10 28,32 32,28" fill="#AA7F38"/>
  
  <!-- South pointer (Dark Ink) -->
  <polygon points="32,54 36,32 32,36" fill="#1F2F4A"/>
  <polygon points="32,54 28,32 32,36" fill="#0B1320"/>

  <!-- East pointer -->
  <polygon points="54,32 32,28 36,32" fill="#D5B26E"/>
  <polygon points="54,32 32,36 36,32" fill="#AA7F38"/>

  <!-- West pointer -->
  <polygon points="10,32 32,28 28,32" fill="#334768"/>
  <polygon points="10,32 32,36 28,32" fill="#1F2F4A"/>

  <!-- Center Pivot -->
  <circle cx="32" cy="32" r="3" fill="#FAF8F5" stroke="#0B1320" stroke-width="1.5"/>
</svg>

